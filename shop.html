<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shop Simple Couture women, men, and kids clothing including sweaters, denim, and jackets from Johannesburg, South Africa."
    />
    <meta
      name="keywords"
      content="shop Simple Couture, women sweater, men sweater, kids jackets, South African clothing, Johannesburg fashion store"
    />
    <meta name="author" content="Simple Couture" />
    <link rel="canonical" href="shop.html" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
    <title>Simple Couture | Shop Clothing Online</title>
  </head>
  <body>
    <header>
      <div class="site-header">
        <a class="brand" href="index.html">Simple Couture</a>
        <nav aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="shop.html" aria-current="page">Shop</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-intro">
        <p class="eyebrow">Dynamic catalogue</p>
        <h1>Shop Sustainable Everyday Clothing</h1>
        <p>
          Browse curated fits for women, men, and kids. Use the search and
          filters to find sweaters, denim, and jackets quickly.
        </p>
      </section>

      <section>
        <div class="shop-controls" aria-label="Product filters">
          <label>
            Search products
            <input
              id="product-search"
              type="search"
              placeholder="Search sweater, jeans, jacket..."
              autocomplete="off"
            />
          </label>
          <label>
            Category
            <select id="category-filter">
              <option value="all">All categories</option>
              <option value="Women">Women</option>
              <option value="Men">Men</option>
              <option value="Kids">Kids</option>
            </select>
          </label>
          <label>
            Sort by
            <select id="sort-products">
              <option value="featured">Featured</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="name">Name A-Z</option>
            </select>
          </label>
        </div>
        <p class="results-count" data-product-count></p>
        <div class="product-grid" data-product-grid></div>
      </section>
    </main>

    <footer>
      <p>Women | Men | Kids | Denim | Outerwear</p>
      <p>&copy; 2026 Simple Couture</p>
    </footer>
  </body>
</html>
