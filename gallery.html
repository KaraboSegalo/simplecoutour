<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View the Simple Couture gallery featuring sustainable sweaters, denim, and jackets for women, men, girls, and boys."
    />
    <meta
      name="keywords"
      content="Simple Couture gallery, fashion gallery, sustainable fashion images, women jeans, men jeans, kids sweaters"
    />
    <meta name="author" content="Simple Couture" />
    <link rel="canonical" href="gallery.html" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
    <title>Simple Couture | Clothing Gallery</title>
  </head>
  <body>
    <header>
      <div class="site-header">
        <a class="brand" href="index.html">Simple Couture</a>
        <nav aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="shop.html">Shop</a>
          <a href="gallery.html" aria-current="page">Gallery</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-intro">
        <p class="eyebrow">Interactive lightbox</p>
        <h1>Gallery</h1>
        <p>
          Click any look to view it in a larger lightbox. The collection shows
          how each piece moves from fabric choice to everyday styling.
        </p>
      </section>

      <section>
        <div class="section-heading">
          <p class="eyebrow">Featured looks</p>
          <h2>Women, Men, and Kids Collection</h2>
        </div>
        <div class="gallery-grid" data-gallery-grid></div>
      </section>
    </main>

    <div class="lightbox" data-lightbox hidden>
      <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close image view">
        Close
      </button>
      <img src="" alt="" data-lightbox-image />
      <p data-lightbox-caption></p>
    </div>

    <footer>
      <p>Gallery Showcase</p>
      <p>&copy; 2026 Simple Couture</p>
    </footer>
  </body>
</html>
